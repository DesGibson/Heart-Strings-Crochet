<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Heart Strings Crochet Contact</title>
        <link rel="icon" type="image/png" href="Images\HS_Logo_First-removebg-preview.png">
        <meta charset="utf-8">
        <meta name="author" content="Destiny Gibson">
        <meta name="description" content="This page is the contact page for Heart Strings Crochet website">
        <!--<link rel="canonical" href="https://hscrochet.com/contact/">-->
        <link rel="stylesheet" href="hscrochetStyle.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <nav class="menu">
            <div class="logo">
                <img src="New_Logo__Update_-removebg-preview.png" alt="HSCrochet Logo" width="200px">
            </div>
            <div class="panel">
                <a href="index.html">Home</a>
                <a href="hscrochetGallery.html">Gallery</a>
                <a href="#">About Us</a>
                <a id ="active" href="hscrochetContact.html">Contact Us</a>
            </div>
        </nav>
        <h1>Heart Strings Crochet</h1>
        <p class="intro">"We want to hear from you"</p>
        <h2>Contact Us Today</h2>
        <p>For any questions, queries or concerns, please fill out the form below.</p>
        <br><br>
        <div class="reach">
            <form>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" placeholder="Jane" required>
                <br><br>

                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" placeholder="Doe" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="janedoe@gmail.com" required>
                <br><br>
                
                <label for="island">Which island are you from? </label>
                <select name="island" id="island" required>
                    <option value="abaco">Abaco</option>
                    <option value="acklins">Acklins</option>
                    <option value="andros">Andros</option>
                    <option value="berry">Berry Islands</option>
                    <option value="bimini">Bimini</option>
                    <option value="cat">Cat Island</option>
                    <option value="crook">Crooked Island</option>
                    <option value="eleuthera">Eleuthera</option>
                    <option value="exuma">Exuma</option>
                    <option value="grand">Grand Bahamas</option>
                    <option value="harbour">Harbour Island</option>
                    <option value="inagua">Inagua</option>
                    <option value="long">Long Island</option>
                    <option value="mayaguana">Mayaguana</option>
                    <option value="new">New Providence</option>
                    <option value="ragged">Ragged Island</option>
                    <option value="rumcay">Rum Cay</option>
                    <option value="sansalv">San Salvador</option>
                    <option value="spanwell">Spanish Wells</option>
                    <option value="where">My island isn't here.</option>
                    <option value="none">I'm not from The Bahamas</option>
                </select> 
                <br><br>

                <label for="mess">Message:</label>
                <textarea id="mess" name="mess" rows="4" cols="50" required></textarea>
                <br><br>

                <input type="submit" value="Submit">
                <br><br>
            </form>
        </div>
        <br><br>
        <footer>
            Heart Strings Crochet
        </footer>
    </body>
</html>
